<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>青椒伴学 · 核心UI设计预览</title>
<style>

e-height:1.7!important}.file-links{display:flex;gap:14px;font-size:12px;margin-top:20px}.file-links a{color:#00856e;text-decoration:none}.toggle{font-size:12px;color:#61796e;display:flex;align-items:center;gap:6px}.overview{padding:30px;max-width:1600px;margin:auto}.overview[hidden]{display:none}.shell[hidden]{display:none}.overview h1{margin:0 0 8px;font-size:25px}.overview p{color:#71847c;font-size:13px}.overview h2{font-size:17px;margin-top:32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:24px}.thumb{display:block;align-self:start;border:0;background:transparent;border-radius:0;padding:0;text-align:left}.thumb img{display:block;width:100%;height:auto}.status{color:#7a9086;font-size:11px;margin-top:20px}
@media(min-height:1050px){.screen{width:390px}}@media(max-width:1100px){.shell{grid-template-columns:200px minmax(350px,1fr) 285px}.workspace{padding:19px 12px}.detail{padding:20px 18px}.rail{padding:15px 10px}header{padding:16px 20px}}@media(max-width:900px){.shell{grid-template-columns:190px 1fr}.detail{grid-column:2;position:static;max-height:none;border-top:1px solid #dfe9e4}.workspace{grid-column:2}.rail{grid-row:1 / 3;max-height:calc(100vh - 86px)}.stage{max-height:none}.tools{gap:6px}.tools a{display:none}.screen{width:390px}}@media(max-width:620px){header{padding:14px 16px;align-items:flex-start;flex-wrap:wrap;gap:12px}.brand strong{font-size:16px}.tools{width:100%;justify-content:space-between}.tools button{font-size:12px;padding:7px 9px}.shell{display:block}.rail{position:static;max-height:170px;border-bottom:1px solid #dfe9e4;border-right:0;padding:10px 14px}.rail input{position:sticky;top:-10px}.rail h3{margin:12px 8px 5px}.rail nav{display:flex;flex-wrap:wrap;gap:4px}.rail nav>section{display:contents}.rail nav h3{display:none}.nav-item{width:auto;font-size:11px;padding:5px 7px}.nav-item span{display:none}.workspace{padding:17px 10px}.work-head{padding:0 7px}.stage{padding:0 0 12px}.screen{border-radius:0}.detail{padding:22px}.overview{padding:22px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.brand small{font-size:9px}}

<header><div class="brand"><div class="brand-mark">青</div><div><strong>青椒伴学 · 核心 UI</strong><small>设计审阅</small></div></div><div class="tools"><label class="toggle"><input id="hotspot-toggle" type="checkbox">显示交互热区</label><button id="overview-toggle">页面总览</button><button id="study-start" class="primary">查看学习计划</button></div></header>
<main class="shell" id="shell" hidden><aside class="rail"><input id="search" aria-label="搜索页面" placeholder="搜索页面或状态"><nav id="nav" aria-label="设计页面目录"></nav></aside><section class="workspace"><div class="work-head"><div><h1 id="page-title"></h1><p id="page-meta"></p></div><div class="step-controls"><button id="read-interaction" class="detail-jump">交互说明</button><button id="previous" aria-label="上一张">‹</button><button id="next" aria-label="下一张">›</button></div></div><div class="stage" id="stage"><div class="screen" id="screen"><img id="screen-image" alt=""><div id="hotspots"></div></div></div></section><aside class="detail" id="interaction-detail">

  <p id="requirements"></p>

  <ul id="rules"></ul>
  <section id="actions-section">
    <h3>可操作入口与结果</h3>
    <div id="actions" class="action-links"></div>
  </section>
  <section id="examples-section">
    <h3>状态演示</h3>
    <div id="examples" class="action-links"></div>
  </section>
  <div class="file-links">

    <a id="download" download>下载 PNG</a>
  </div>

</aside></main>
