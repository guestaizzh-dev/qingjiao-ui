e-height:1.7!important}.file-links{display:flex;gap:14px;font-size:12px;margin-top:20px}.file-links a{color:#00856e;text-decoration:none}.toggle{font-size:12px;color:#61796e;display:flex;align-items:center;gap:6px}.overview{padding:30px;max-width:1600px;margin:auto}.overview[hidden]{display:none}.shell[hidden]{display:none}.overview h1{margin:0 0 8px;font-size:25px}.overview p{color:#71847c;font-size:13px}.overview h2{font-size:17px;margin-top:32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:24px}.thumb{display:block;align-self:start;border:0;background:transparent;border-radius:0;padding:0;text-align:left}.thumb img{display:block;width:100%;height:auto}.status{color:#7a9086;font-size:11px;margin-top:20px}

<script id="review-data" type="application/json">{"screens":[{"id":"00","group":"首页","name":"首页 · 已排课","file":"00-首页-已排课.png"},{"id":"00-empty","group":"首页","name":"首页 · 未排课","parent":"00","file":"00-首页-未排课.png"},{"id":"01","group":"账号","name":"手机号登录","parent":null,"spec":"A clean welcoming phone-code login screen, no tabs or back arrow. Compact green pepper smiling brand logo above 青椒伴学. Warm heading 欢迎回来 and subtitle 让学习有人陪，让成长看得见. White form card contains labels 购课登记手机号 and 短信验证码, phone input placeholder 请输入购课登记手机号, code input 请输入验证码 and inline 获取验证码. Wide turquoise 登录并开始学习 button. Below an UNCHECKED consent checkbox with 我已阅读并同意 plus separate 用户协议 and 隐私政策 text links. Small supporting text 仅面向已购伴学服务、由老师建档的学生. No registration, no password login, no social logins, no fake SMS duration/countdown, no demonstration 123456 in product UI. Friendly illustration no more than 20% of screen.","file":"01-手机号登录.png"},{"id":"02","group":"账号","name":"选择学生","parent":null,"spec":"Subpage title 选择学生. Heading 今天，陪谁一起学习？ subtitle 同一账号下的学生，学习记录各自独立. Two large tappable white student rows: illustrated friendly pepper avatar, 林小禾 / 五年级 · 数学, right chevron; second slightly different friendly pepper expression, 林小满 / 七年级 · 数学, right chevron. Subtle current badge 当前学生 on 林小禾 for this switch-student variant, not an editable control. Bottom explanation 学生档案由老师建立，如有疑问请联系老师. No 新增学生, no editing grade, no destructive controls. No bottom tabs.","file":"02-选择学生.png"},{"id":"02A","group":"账号","name":"完善学习信息","parent":"02","file":"02A-完善学习信息.png","spec":"沿用02的852×1846画布比例；按当前学生确认年级及教材版本。"},{"id":"03","group":"账号","name":"未关联学生","parent":null,"spec":"Subpage title 暂未关联学生. Spacious centered empty-state illustration: small friendly pepper holding an unlinked student card, modern teal/lime illustrative style, not sad or alarming. Title 当前手机号尚未关联学生. Body 请使用购课登记手机号登录，或通过已有服务渠道联系老师. A single primary 更换手机号 button. Below subtle helper 学生档案由老师建立. No 自动创建, no 注册, no invented teacher contact QR or unknown phone.","file":"03-未关联学生.png"},{"id":"04","group":"学习","name":"周历与待发布周报","parent":null,"spec":"Main STUDY tab screen. Page heading 学习, subtitle 看得见安排，也看得见每一次努力, small pepper mascot top right matching brand. First white calendar card: title 这周的学习安排, small 回到本周 link. Week header left/right chevrons, 11月2日—11月8日. Exactly one row of seven days 周一 2, 周二 3, 周三 4, 周四 5, 周五 6, 周六 7, 周日 8. 4 selected turquoise rounded capsule, small course dots under 2,4,6, no dots other dates. Supporting legend 有已发布安排 · 点击日期查看. Below section 本周学习周报, generous white empty-state card with small illustrated report/book icon, 本周周报尚未发布, 老师发布后，你可以在这里查看, secondary outlined 查看上周周报 button. No monthly calendar, no separate tabs for 周计划/学习周报, no create plan control. Bottom navigation visible with 学习 active.","file":"04-周历与待发布周报.png"},{"id":"05","group":"学习","name":"上周已发布周报","parent":"04","spec":"Keep precisely the same 学习 main screen layout as second reference, with 学习 tab selected. Calendar week changes to 10月26日—11月1日 and seven day numbers 26,27,28,29,30,31,1, course dots under26,28,30; 30 selected. Section 上周学习周报. Replace unpublished empty card with published report card, small report illustration on right, title 一周，一点进步, date10.26—11.01, metadata 3次安排 · 2份作业已提交, small 已发布 · 第1版 pill, turquoise 查看周报 button. Keep 回到本周 link and week chevrons.","file":"05-上周已发布周报.png"},{"id":"06","group":"学习","name":"日期课程弹层","parent":"04","spec":"Date-schedule BOTTOM SHEET overlay on the same 学习 calendar screen as second reference. Dim background softly but retain recognizable calendar and tab bar; overlay covers lower ~53%. Sheet white, rounded top corners, drag handle and close x. Title 11月4日的学习安排, subtitle 周三 · 已发布. One course white/mint card: 数学, 小数乘法的算理, 今天19:00—19:40. Small beautiful math video thumbnail 0.3 × 4 with play symbol, metadata 视频1个 · 原练习3题. Two clear actions: primary 进入学习, secondary 预览练习. Do not repeat 今天上课 badges, do not force video before practice. Sheet padded above home indicator, no tab bar on top of sheet.","file":"06-日期课程弹层.png"},{"id":"07","group":"学习","name":"当天无课程弹层","parent":"06","spec":"State variant of the date-schedule bottom sheet second reference. Background calendar retains current week but select 周四5. Compact white bottom sheet about 36% height with close button and handle. Heading 11月5日的学习安排. Small outlined mint calendar illustration. Message 当天暂无已发布课程. Supporting text 可以切换日期，查看其他学习安排. Neutral 知道了 button that closes sheet. No course cards, no 创建计划 or guessed future plans, no fake data.","file":"07-当天无课程弹层.png"},{"id":"08","group":"课时","name":"课时详情","parent":null,"spec":"Subpage header 学习内容. Top date 11月4日 周三 · 19:00—19:40, heading 小数乘法的算理. Supporting 按自己的节奏开始，不需要依次完成. FOUR compact separate white action cards stacked with balanced spacing, not a timeline requiring order. Each has colorful icon left, text middle and control right:\n看视频 / 已观看35% / 继续观看.\n做练习 / 原练习 · 3题 · 可下载打印 / 预览练习.\n交作业 / 纸笔完成后，拍照整份上传 / 上传作业.\n老师反馈 / 老师发布后可以查看 / 查看状态 (secondary).\nAt bottom a quiet tip 视频、练习与作业可自由进入. No completed/掌握 claims. No empty 加练 entry before teacher publishes, no tabs. All four action cards must fit without compressed glyphs.","file":"08-课时详情.png"},{"id":"09","group":"课时","name":"未来课时未开放","parent":"08","spec":"Exact layout variant of lesson detail reference. Date11月6日 周五 · 19:00—19:40, same course 小数乘法的算理. Add quiet visible mint notice 11月6日00:00开放视频与作业提交 and small 北京时间. 看视频 card locked with 未到学习日 and gray disabled 待开放; 做练习 card remains active 预览练习 with3题 and PDF info; 交作业 locked 待开放; 老师反馈 secondary 查看状态 not a fake published result. Supporting text 现在可以预览练习. No countdown or unlock time19:00; schedule time is not the lock threshold.","file":"09-未来课时未开放.png"},{"id":"10","group":"视频","name":"视频学习 · 多课程","parent":null,"spec":"390×844布局基准，852×1846设计稿；一排三节课程，播放器内倍速，关键节点真人形象AI老师讲解示意；下方总结卡片留足间距，无播放位置提示行。","file":"10-视频播放.png"},{"id":"11","group":"视频","name":"网络失败","parent":"10","spec":"Same 视频学习 layout as reference. Within 16:9 player replace lesson image with calm very pale mint error surface, small tasteful disconnected-network illustration, heading 网络连接失败, helper 请检查网络后重试 and primary 重试播放 button. Keep below course 小数乘法的算理 and remembered-position helper. Bottom 前往练习 remains accessible. No cartoon alarm, no entire-screen huge warning. Preserve page geometry.","file":"11-网络失败.png"},{"id":"12","group":"视频","name":"无观看权限","parent":"10","spec":"Same 视频学习 page geometry. In player state surface use small mint shield/lock illustration, heading 暂无该视频观看权限, helper 请联系老师了解详情. No retry-play button, no purchase or renew CTA. Course title and 前往练习 remain below. Secondary 联系老师 text control may open existing shared contact sheet. Distinguish this state clearly from network failure.","file":"12-无观看权限.png"},{"id":"13","group":"视频","name":"资源不可用","parent":"10","spec":"Same 视频学习 page geometry. In player state area show small mint file/video unavailable illustration, heading 视频资源暂不可用, helper 请稍后再试，或联系老师了解详情. No claim permission expired, no invented reason, no purchase or renewal. Keep course heading and 前往练习 below.","file":"13-资源不可用.png"},{"id":"14","group":"视频","name":"观看有效期届满","parent":"10","spec":"Same 视频学习 page geometry. Player state shows small calendar-lock illustration, heading 视频观看有效期已届满, helper 请联系老师了解详情. Secondary 联系老师 button. Retain 小数乘法的算理 and 前往练习 below. Do not show guessed validity length or automatic renewal. Do not call this 服务到期: video authorization is independent of service.","file":"14-观看有效期届满.png"},{"id":"15","group":"练习作业","name":"原练习预览","parent":null,"spec":"Subpage 练习预览. Label 原练习 · 纸笔作答, right 共3题, heading 小数乘法的算理. White paper-like content with three clear numbered questions and generous ruled handwriting space:\n1. 计算：0.3 × 4 = ______\n2. 一盒彩笔2.5元，买3盒一共多少钱？\n3. 小禾每天步行1.2千米，5天一共步行多少千米？\nThese are static printable questions, NOT input fields, no answer buttons or correct answers.\nBottom fixed action area with outlined 下载原练习PDF and primary 完成了，上传作业. Small helper 练习PDF不含答案，反馈发布后可查看. Ensure handwriting spaces and questions visible; numbered questions printed on a single paper sheet. No bottom tabs.","file":"15-原练习预览.png"},{"id":"16","group":"练习作业","name":"老师加练预览","parent":"15","spec":"Same printable exercise page layout but nav title 巩固加练. Tag 老师发布 · 一轮加练. Title 小数乘法巩固练习, 共3题. Paper questions: 1.计算：0.4 × 3 = ______; 2.每盒彩笔2.6元，4盒共多少元？; 3.每天步行1.5千米，4天共多少千米？ Handwriting areas, no answers and no online inputs. Bottom secondary 下载加练PDF and primary 完成了，上传加练. Small text 老师发布后即可完成，不另扣课时. No automatic second round, no mastery meter.","file":"16-老师加练预览.png"},{"id":"17","group":"练习作业","name":"多图作业待提交","parent":null,"spec":"Subpage 原练习作业. Course 小数乘法的算理, subtitle11月4日 周三 · 原练习. Gentle helper 请拍清整页，保留题目和答案. White upload area: two realistic photographed elementary math homework paper thumbnails with tidy visible pencil arithmetic and page numbers 第1张, 第2张. These are photographs, not flat icons. Each thumbnail small x delete control at top-right. A third equal-size dashed mint + 添加图片 tile with 拍照或从相册选择 helper. Below note 支持多张图片，不支持PDF上传. Wide bottom primary 确认整份提交 · 2张. Helper 提交后可查看，老师退回后才能修改. Small neutral note 21:00后仍可提交. No demo-image button, no hard-coded file-size limit or max count.","file":"17-多图作业待提交.png"},{"id":"18","group":"练习作业","name":"整份提交确认","parent":"17","spec":"Exact upload page as reference behind a lightly dimmed scrim. White compact BOTTOM SHEET with handle, small check/document illustration. Heading 确认提交这份作业？ Body 共2张图片，请确认题目与答案完整清晰. Small helper 提交后可查看，老师退回后才能修改. Full turquoise 确认提交 and secondary 继续检查. Close x, safe bottom padding. Photo thumbnails behind stay selected. No automatic deletion, no irrevocable exaggerated warning.","file":"18-整份提交确认.png"},{"id":"19","group":"练习作业","name":"上传失败保留图片","parent":"17","spec":"Exact editable upload page geometry as reference, keep BOTH homework photo thumbnails selected with delete controls and add tile. Add in-context gentle coral error row 上传失败，已保留所选图片 and secondary 请检查网络后重试 near submission area. Primary button 重试整份提交 · 2张. No reset const data=JSON.parse(document.getElementById('review-data').textContent),byId=new Map(data.screens.map(s=>[s.id,s])),groups=[...new Set(data.screens.map(s=>s.group))];

let selectedStudent='林小禾';

function chooseStudent(name){selectedStudent=name;go('02A')}

const host=el('learning-fields');host.replaceChildren();

const studentName=make('span',selectedStudent,'learning-value');host.append(studentName);

['grade','就读年级',['一年级','二年级','三年级','四年级','五年级','六年级','七年级','八年级','九年级']],
['textbook','教材版本',['人教版','北师大版','苏教版','其他版本']]
];
for(const [key,label,values] of fields){
const select=make('select',undefined,'learning-select '+key);select.setAttribute('aria-label',label);select.required=true;
for(const value of values){const option=make('option',value);option.value=value;select.append(option)}
select.value=saved[key];select.onchange=()=>{saved={...saved,[key]:select.value};learningSelections.set(selectedStudent,saved)};host.append(select);
}
learningSelections.set(selectedStudent,saved);
}
function make(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
function go(id,push=true){if(!byId.has(id))id='04';current=id;if(push)history.pushState(null,'','#'+id);render();if(inOverview)toggleOverview(false)}

if(current==='02'&&to==='02A')chooseStudent(label.includes('林小满')?'林小满':'林小禾');else go(to);
};return b}));
document.querySelectorAll('.nav-item').forEach(n=>{n.classList.toggle('active',n.dataset.id===current);if(n.dataset.id===current)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});learningFields();el('stage').scrollTop=0;document.title=s.name+' · 青椒伴学UI设计';if(window.renderEnhancements)window.renderEnhancements();}
function buildNav(){el('nav').replaceChildren(...groups.map(g=>{const section=make('section');section.append(make('h3',g));for(const s of data.screens.filter(s=>s.group===g)){const b=make('button',undefined,'nav-item');b.dataset.id=s.id;b.append(make('span',s.id),make('b',s.name));b.onclick=()=>go(s.id);section.append(b)}return section}));}
function buildOverview(){el('overview-groups').replaceChildren(...groups.map(g=>{const section=make('section');section.append(make('h2',g));const grid=make('div',undefined,'grid');for(const s of data.screens.filter(s=>s.group===g)){const b=make('button',undefined,'thumb'),img=make('img');img.src=encodeURI(s.file);img.alt=s.name;img.loading='lazy';b.setAttribute('aria-label',s.id+' / '+s.name);b.append(img);b.onclick=()=>go(s.id);grid.append(b)}section.append(grid);return section}));}
